env_type: world_model
backend: remote
task_suite_name: libero_spatial
wm_env_type: libero

total_num_envs: null

auto_reset: False
ignore_terminations: False
max_steps_per_rollout_epoch: 240
max_episode_steps: 240

use_rel_reward: True
reward_coef: 1.0

reset_gripper_open: True
is_eval: False

seed: 0
group_size: 1
use_fixed_reset_state_ids: True
use_ordered_reset_state_ids: False
specific_reset_id: null

video_cfg:
  save_video: True
  info_on_video: True
  video_base_dir: ${runner.logger.log_path}/video/train

enable_offload: False

wan_wm_hf_ckpt_path: null
enable_kir: False
initial_image_path: ${.wan_wm_hf_ckpt_path}/dataset/

num_inference_steps: 5
chunk: 8
condition_frame_length: 5
image_size: [256, 256]
num_frames: 13

remote:
  server_url: null
  server_urls: null
  model: wovr-libero-spatial
  transport: wovr_batch
  encoding: raw
  num_inference_steps: ${..num_inference_steps}
  request_timeout_s: 300
  max_retries: 2
  step_budget_s: 900

reward_model:
  type: ResnetRewModel
  from_pretrained: ${..wan_wm_hf_ckpt_path}/resnet_rm.pth
